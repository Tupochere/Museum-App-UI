name: Build & Publish APK

# Triggers when you push a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtengatenga_ar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the app is developed against. Newer Flutter
      # drops the namespace shim that legacy plugins (arcore_flutter_plugin)
      # rely on, which breaks the release build.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true

      # The app loads .env as a bundled asset at startup; it is gitignored,
      # so recreate it from repository secrets for the CI build.
      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      # Restore the release keystore (base64-encoded) and its credentials.
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Brick adapters
        run: dart run build_runner build --delete-conflicting-outputs

      # arcore_flutter_plugin 0.1.0 (unmaintained) declares no namespace, which
      # AGP 8.x requires. Inject one into the plugin's build.gradle. The manifest
      # usually has no package attribute (that's why AGP complains), so fall back
      # to the plugin's known package name.
      - name: Patch legacy plugin namespaces
        run: |
          set -x
          for gradle in $(find ~/.pub-cache/hosted/pub.dev/arcore_flutter_plugin-*/android -maxdepth 1 -name build.gradle); do
            # Bump the ancient compileSdk (29) so androidx resources such as
            # android:attr/lStar (API 31+) resolve during resource linking.
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/' "$gradle"
            # Inject a namespace (AGP 8 requires one; the plugin ships without).
            if ! grep -qE "namespace[[:space:]]+['\"]" "$gradle"; then
              ns="com.difrancescogianmarco.arcore_flutter_plugin"
              manifest="$(dirname "$gradle")/src/main/AndroidManifest.xml"
              if [ -f "$manifest" ]; then
                p=$(grep -oP 'package="\K[^"]+' "$manifest" | head -1 || true)
                [ -n "$p" ] && ns="$p"
              fi
              sed -i "0,/^android {/s|^android {|android {\n    namespace \"$ns\"|" "$gradle"
              echo "Patched namespace -> $ns"
            fi
            echo "=== $gradle ==="; grep -nE "compileSdkVersion|namespace" "$gradle" || true
          done

      - name: Build release APK
        run: flutter build apk --release

      # Produce two copies: a versioned name for the archive, and a stable
      # name so a landing page can link to a permanent "latest" download URL:
      #   https://github.com/Tupochere/Museum-App-UI/releases/latest/download/mtengatenga-ar.apk
      - name: Stage APKs
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/mtengatenga-ar-${{ github.ref_name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             ../dist/mtengatenga-ar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mtengatenga-ar-${{ github.ref_name }}.apk
            dist/mtengatenga-ar.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
